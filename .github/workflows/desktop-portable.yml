name: Desktop portable
run-name: Desktop portable · ${{ inputs.tag || github.event.release.tag_name }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to build (vX.Y.Z, e.g. v1.2.3)
        type: string
        required: true
      publish:
        description: Upload the portable ZIP to an existing stable release (requires tag)
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: desktop-portable-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  # A portable build is the portable variant of an upstream stable release:
  # the tag is the single source of truth for the checkout and the version.
  # Fail before spending Windows runner minutes when the tag is not stable or
  # a manual publish cannot target an already published release.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve and validate stable tag
        id: resolve
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -eu
          if [[ ! "$TAG" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::A stable release tag (vX.Y.Z) is required; development builds are not published."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Validate published release rebuild
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -eu
          published="$(gh release view "$TAG" --json isDraft,isPrerelease \
            --jq '.isDraft == false and .isPrerelease == false')"
          if [[ "$published" != true ]]; then
            echo "::error::Rebuild publication requires an already published stable release."
            exit 1
          fi

  build:
    name: Desktop portable · windows-x64
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.tag }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Resolve Git version
        id: version
        shell: bash
        env:
          WENYI_BUILD_TAG: ${{ needs.plan.outputs.tag }}
        run: uv run --no-project --with hatch-vcs python scripts/release/release_version.py --github-output "$GITHUB_OUTPUT"
      - name: Assert version matches the release tag
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
          ACTUAL_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          if [[ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Resolved version $ACTUAL_VERSION does not equal tag version $EXPECTED_VERSION."
            exit 1
          fi
      - uses: pnpm/action-setup@v5
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop -> target
          add-job-id-key: false
          add-rust-environment-hash-key: false
      - name: Build the native lock library
        run: cargo build --release --manifest-path native/wenyi-locks/Cargo.toml
      - run: pnpm install --frozen-lockfile
      - name: Build the portable executable and engine
        run: pnpm desktop:build --no-bundle
        env:
          WENYI_BUILD_TAG: ${{ needs.plan.outputs.tag }}
          WENYI_UPDATE_REPO: ${{ github.repository }}
      - name: Verify native Windows GUI subsystem
        run: uv run --no-project python scripts/dev/desktop_pe.py target/release/wenyi-desktop.exe
      - name: Package portable edition
        run: >
          uv run --no-project python scripts/release/package_portable.py
          --version "${{ steps.version.outputs.version }}"
          --binary target/release/wenyi-desktop.exe
          --sidecar apps/desktop/sidecar/wenyi-engine
          --output release-assets
      - name: Verify portable archive
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Get-ChildItem release-assets/*-portable.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath portable-check
          $exe = Get-ChildItem portable-check -Recurse -Filter wenyi-desktop.exe | Select-Object -First 1
          $actual = (& $exe.FullName --version).Trim()
          if ($actual -ne "Wenyi Desktop $env:EXPECTED_VERSION") {
            throw "Unexpected portable version: $actual"
          }
          $root = $exe.Directory.FullName
          if (!(Test-Path (Join-Path $root "portable.marker"))) {
            throw "Missing portable.marker"
          }
          if (!(Test-Path (Join-Path $root "sidecar/wenyi-engine/wenyi-engine.exe"))) {
            throw "Missing sidecar engine"
          }
          if (Test-Path (Join-Path $root "data")) {
            throw "The portable archive contains data/"
          }
      - uses: actions/upload-artifact@v6
        with:
          name: wenyi-desktop-${{ steps.version.outputs.version }}-windows-x64-portable
          path: release-assets/*-portable.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish portable asset · ${{ needs.plan.outputs.tag }}
    if: >-
      github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: "*-windows-x64-portable"
          path: release-assets
          merge-multiple: true
      - name: Generate portable checksums
        working-directory: release-assets
        run: sha256sum *-portable.zip > wenyi-desktop-portable-SHA256SUMS.txt
      - name: Upload portable assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GH_REPO" >/dev/null
          gh release upload "$TAG" release-assets/* --repo "$GH_REPO"
